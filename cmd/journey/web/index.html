<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hopwake</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235e6ad2'/%3E%3Cpath d='M6 19c3.3 0 3.3-6.5 6.7-6.5S16 19 19.3 19s3.4-6.5 6.7-6.5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fbfbfc; --side:#f4f4f6; --panel:#ffffff; --line:#e7e7eb; --line2:#efeff2; --ink:#17171c; --quiet:#62626e;
    --accent:#5e6ad2; --accent-bg:#eef0fd; --warn:#c2410c; --warn-dot:#ea7a35; --warn-bg:#fdf1e9; --dot:#17171c; --off:#d7d7de;
    --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  :root[data-theme=dark] {
    --bg:#0f0f12; --side:#0b0b0e; --panel:#141418; --line:#25252c; --line2:#1d1d23; --ink:#ececf1; --quiet:#9b9ba8;
    --accent:#8c94ff; --accent-bg:#1c1e33; --warn:#f39a5c; --warn-dot:#f39a5c; --warn-bg:#2a1b12; --dot:#ececf1; --off:#34343d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--mono); font-size: 12px; }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  .app { display: flex; flex-wrap: wrap; min-height: 100%; }
  nav.side { flex: 1 1 220px; max-width: 240px; background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 4px 10px 18px; font-weight: 600; letter-spacing: -0.01em; }
  .brand span.t { margin-left: auto; color: var(--quiet); font-size: 12px; font-weight: 400; }
  .navlink { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; color: var(--quiet); font-weight: 500; cursor: pointer; }
  .navlink:hover { background: var(--line2); color: var(--ink); }
  .navlink.on { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .navlink .n { margin-left: auto; font-size: 11px; }
  .sidehead { margin-top: 20px; padding: 0 10px 6px; font-size: 11px; color: var(--quiet); font-weight: 500; display: flex; justify-content: space-between; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--off); flex: none; display: inline-block; }
  .dot.bad { background: var(--warn-dot); }
  main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; }
  .top { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .search { flex: 1 1 260px; max-width: 460px; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--quiet); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); }
  kbd { font-family: inherit; font-size: 11px; color: var(--quiet); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .btn { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--quiet); }
  select.btn { padding-right: 8px; }
  .content { padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 28px; max-width: 1180px; width: 100%; }
  .quiet { color: var(--quiet); }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 500; background: var(--line2); color: var(--quiet); }
  .chip.bad { background: var(--warn-bg); color: var(--warn); }
  .chip .dot { width: 6px; height: 6px; }
  .chip.shape { background: var(--accent-bg); color: var(--accent); }
  .fields { display: flex; flex-direction: column; gap: 2px; font-family: var(--mono); font-size: 12px; }
  .fields .add { color: var(--ink); }
  .fields .rem { color: var(--warn); text-decoration: line-through; }
  .fields .same { color: var(--quiet); }
  h1 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
  .panel { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .route { display: flex; overflow-x: auto; padding-bottom: 4px; }
  .hop { flex: 1 1 150px; min-width: 150px; padding: 10px 12px 12px; border-radius: 8px; border: 1px solid transparent; text-align: left; background: transparent; cursor: pointer; }
  .hop:hover { background: var(--line2); }
  .hop.sel { border-color: var(--line); background: var(--panel); }
  .hop .line { display: flex; align-items: center; gap: 6px; }
  .hop .bar { flex: 1; height: 1px; background: var(--off); }
  .hop .via { font-family: var(--mono); font-size: 10px; color: var(--quiet); white-space: nowrap; }
  .hop .via.bad { color: var(--warn); }
  .hop .k { margin-top: 10px; font-weight: 500; white-space: nowrap; }
  .hop .m { color: var(--quiet); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ring { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .grid { overflow-x: auto; }
  .grow { display: grid; align-items: center; height: 30px; border-top: 1px solid var(--line2); }
  .grow.head { height: 28px; color: var(--quiet); font-size: 11px; border-top-color: var(--line); }
  .grow.pick { cursor: pointer; }
  .grow.pick:hover, .grow.pick.on { background: var(--line2); }
  pre.payload { margin: 4px 0 0; padding: 8px; border-radius: 6px; background: var(--side); font-family: var(--mono); font-size: 11px; white-space: pre-wrap; word-break: break-all; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }
  .cell { width: 9px; height: 9px; border-radius: 50%; margin: auto; }
  .cell.rej { width: auto; height: auto; border-radius: 0; color: var(--warn); font-weight: 600; line-height: 1; }
  .split { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
  dt { color: var(--quiet); }
  dd { margin: 0; text-align: right; font-family: var(--mono); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0 14px; height: 34px; border-top: 1px solid var(--line2); white-space: nowrap; }
  th { color: var(--quiet); font-weight: 500; font-size: 11px; height: 28px; border-top-color: var(--line); }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--line2); }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .empty { padding: 16px; color: var(--quiet); }
  .err { padding: 10px 12px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); }
  @media (max-width: 720px) { nav.side { max-width: none; flex-basis: 100%; border-right: 0; border-bottom: 1px solid var(--line); } .content { padding: 20px 16px 40px; } .top { padding: 0 16px; height: auto; min-height: 52px; } }
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Main">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 15c3 0 3-6 6-6s3 6 6 6 3-6 6-6"/></svg>
      Hopwake <span class="t" id="tenant"></span>
    </div>
    <a class="navlink" id="navFleet" href="#/">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Fleet <span class="n" id="fleetCount"></span></a>
    <a class="navlink" id="navMappings" href="#/mappings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H13a3 3 0 0 1 3 3v6.5"/></svg>
      Mappings</a>
    <a class="navlink" id="navAggregates" href="#/aggregates">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h4M4 12h4M4 18h4M8 6l6 6M8 18l6-6M14 12h6"/></svg>
      Aggregates</a>
    <div class="sidehead"><span>Needs attention</span><span id="attnCount"></span></div>
    <div id="attention"></div>
    <div class="sidehead"><span>Recent</span></div>
    <div id="recent"></div>
  </nav>
  <main>
    <div class="top">
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" aria-label="Find a device" placeholder="Find a device, e.g. dev-00042" autocomplete="off" list="deviceList">
        <kbd>⌘K</kbd>
      </label>
      <datalist id="deviceList"></datalist>
      <span style="flex:1"></span>
      <select class="btn" id="window" aria-label="Time window">
        <option value="15m">Last 15 minutes</option><option value="1h">Last hour</option><option value="6h">Last 6 hours</option><option value="24h">Last 24 hours</option>
      </select>
      <button class="btn" id="themeBtn" type="button" aria-label="Switch light and dark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
    <div class="content" id="view"><div class="empty">Loading…</div></div>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const get = async p => { const r = await fetch(p); if (!r.ok) throw new Error(`${r.status} ${await r.text()}`); return r.json(); };
const time = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const ago = iso => { const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000)); return s < 60 ? `${s} s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`; };
const ms = ns => ns >= 1e9 ? `${(ns / 1e9).toFixed(1)} s` : `${Math.round(ns / 1e6)} ms`;
const hopKind = h => h.split(':')[0];
const hopWhere = h => h.slice(h.indexOf(':') + 1);
const hopShort = h => { const w = hopWhere(h); return hopKind(h) === 'mqtt' ? 'MQTT' : w.split('.').pop(); };
let fleet = null, current = null, selHop = null, timer = null, selJourney = null;
const journeyCache = {};

// Theme: follows the system; a manual choice is remembered in this browser.
function applyTheme(t) { document.documentElement.dataset.theme = t; }
let saved = null; try { saved = localStorage.getItem('hopwake-theme'); } catch {}
const mq = matchMedia('(prefers-color-scheme: dark)');
applyTheme(saved || (mq.matches ? 'dark' : 'light'));
mq.addEventListener('change', e => { if (!saved) applyTheme(e.matches ? 'dark' : 'light'); });
$('themeBtn').onclick = () => { saved = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(saved); try { localStorage.setItem('hopwake-theme', saved); } catch {} };

function recentList() { try { return JSON.parse(localStorage.getItem('hopwake-recent') || '[]'); } catch { return []; } }
function remember(d) { const r = [d, ...recentList().filter(x => x !== d)].slice(0, 6); try { localStorage.setItem('hopwake-recent', JSON.stringify(r)); } catch {} }
const win = () => $('window').value;

function stateChip(state, after, expected, at, rejected) {
  if (state === 'stopped') return `<span class="chip bad"><span class="dot bad"></span>${rejected && at ? `Rejected at ${esc(at)}` : rejected ? 'Rejected' : at ? `Stops at ${esc(at)}` : after ? `Stops after ${esc(hopShort(after))}` : 'Stopped'}</span>`;
  if (state === 'unsure') return '<span class="chip" title="the tap did not fully watch a hop this verdict depends on"><span class="dot"></span>Waiting for tap</span>';
  if (state === 'silent') return '<span class="chip bad"><span class="dot bad"></span>Silent</span>';
  if (state === 'unknown') return expected ? '<span class="chip bad"><span class="dot bad"></span>Never seen</span>' : '<span class="chip">Never seen</span>';
  return '<span class="chip"><span class="dot"></span>Healthy</span>';
}
// What the tap missed at a hop, in local time.
function tapText(b) {
  const recent = Date.now() - new Date(b.to) < 15000;
  if (b.away) return `The tap was not watching ${hopShort(b.hop)} from ${time(b.from)}${recent ? '' : ` to ${time(b.to)}`}`;
  if (b.missed) return `The tap missed ${b.missed} readings at ${hopShort(b.hop)} since ${time(b.from)}`;
  return `The tap fell ${Math.round(b.behind_ns / 1e9)} s behind at ${hopShort(b.hop)}`;
}
// One sentence per kind of trouble, hops in route order.
function tapSummary(list, route) {
  const order = h => { const i = route.indexOf(h); return i < 0 ? 99 : i; };
  const groups = new Map();
  for (const b of [...list].sort((x, y) => order(x.hop) - order(y.hop))) {
    const key = b.away ? `away ${time(b.from)}` : b.missed ? `missed ${b.hop}` : `behind ${b.hop}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(b);
  }
  const names = bs => { const n = bs.map(b => hopShort(b.hop)); return n.length > 1 ? `${n.slice(0, -1).join(', ')} and ${n[n.length - 1]}` : n[0]; };
  return [...groups.values()].map(bs => bs[0].away && bs.length > 1
    ? `The tap was not watching ${names(bs)} from ${time(bs[0].from)}.`
    : `${tapText(bs[0])}.`).join(' ');
}
const isProblem = d => d.state === 'stopped' || d.state === 'silent' || (d.state === 'unknown' && d.expected);

async function loadFleet() {
  fleet = await get(`/api/fleet?window=${win()}`);
  $('tenant').textContent = fleet.tenant;
  const bad = fleet.devices.filter(isProblem);
  $('fleetCount').textContent = fleet.devices.length;
  $('attnCount').textContent = bad.length || '';
  $('attention').innerHTML = bad.length ? bad.slice(0, 12).map(d => `<a class="navlink mono" style="font-size:12px" href="#/device/${encodeURIComponent(d.device)}"><span class="dot bad"></span>${esc(d.device)}</a>`).join('') : '<div class="navlink" style="cursor:default">All devices healthy</div>';
  $('recent').innerHTML = recentList().map(d => `<a class="navlink mono" style="font-size:12px" href="#/device/${encodeURIComponent(d)}"><span class="dot ${bad.some(b => b.device === d) ? 'bad' : ''}"></span>${esc(d)}</a>`).join('');
  $('deviceList').innerHTML = fleet.devices.map(d => `<option value="${esc(d.device)}">`).join('');
}

function renderFleet() {
  $('navFleet').classList.add('on');
  $('navMappings').classList.remove('on');
  $('navAggregates').classList.remove('on');
  const devs = fleet.devices, route = fleet.route;
  const n = s => devs.filter(d => d.state === s).length;
  const never = devs.filter(d => d.state === 'unknown' && d.expected).length;
  const intro = fleet.expected
    ? `${n('ok')} of ${fleet.expected} expected devices are healthy in the ${esc(win())} window`
    : `${devs.length} devices seen in the ${esc(win())} window`;
  $('view').innerHTML = `
    <div><h1>Fleet</h1><p class="quiet" style="margin:6px 0 0">${intro}, judged against the route ${route.map(h => `<span class="mono">${esc(hopShort(h))}</span>`).join(' → ')}.</p></div>
    ${(fleet.tap || []).length ? `<p class="quiet" style="margin:0">${esc(tapSummary(fleet.tap, route))} Verdicts that depend on ${fleet.tap.length > 1 ? 'those hops' : 'that hop'} wait until it catches up.</p>` : ''}
    <div class="stats">${devs.some(d => d.shape_changed) ? `<span class="chip shape">${devs.filter(d => d.shape_changed).length} shape changed</span>` : ''}${n('stopped') ? `<span class="chip bad">${n('stopped')} stopped</span>` : ''}${devs.some(d => d.invalid) ? `<span class="chip bad">${devs.filter(d => d.invalid).length} breaking a schema</span>` : ''}${n('silent') ? `<span class="chip bad">${n('silent')} silent</span>` : ''}${n('unsure') ? `<span class="chip">${n('unsure')} waiting for the tap</span>` : ''}${never ? `<span class="chip bad">${never} never seen</span>` : ''}<span class="chip">${n('ok')} healthy</span></div>
    <section class="panel" style="overflow-x:auto" aria-label="Devices">
      ${devs.length ? `<table><thead><tr><th>Device</th><th>State</th>${route.map(h => `<th>Last seen at ${esc(hopShort(h))}</th>`).join('')}</tr></thead><tbody>
      ${devs.map(d => `<tr data-d="${esc(d.device)}"><td class="mono">${esc(d.device)}</td><td>${stateChip(d.state, d.stopped_after, d.expected, d.stopped_at, d.rejected)}${d.shape_changed ? ' <span class="chip shape">Shape changed</span>' : ''}${d.invalid ? ' <span class="chip bad">Breaks schema</span>' : ''}${d.wrong_values ? ' <span class="chip bad">Wrong values</span>' : ''}${d.watched ? ' <span class="chip" title="payloads captured at every hop">Watched</span>' : ''}</td>${route.map((h, i) => `<td class="quiet">${d.last_seen[h] ? ago(d.last_seen[h]) : i === 0 && d.last_ever ? `last ${ago(d.last_ever)}` : '—'}</td>`).join('')}</tr>`).join('')}
      </tbody></table>` : '<div class="empty">No hop events in this window yet. Is the tap running?</div>'}
    </section>`;
  for (const tr of document.querySelectorAll('tbody tr')) tr.onclick = () => location.hash = `#/device/${encodeURIComponent(tr.dataset.d)}`;
}

async function renderDevice(device) {
  $('navFleet').classList.remove('on');
  $('navMappings').classList.remove('on');
  $('navAggregates').classList.remove('on');
  const d = await get(`/api/devices/${encodeURIComponent(device)}?window=${win()}`);
  if (current !== device) { selHop = null; selJourney = null; current = device; remember(device); }
  if (selJourney) { try { journeyCache[selJourney] = await get(`/api/journeys/${selJourney}`); } catch { selJourney = null; } }
  const v = d.verdict, route = d.route, last = route.length - 1;
  const settled = d.journeys.find(j => Date.now() - new Date(j.first) >= 15000);
  const reached = settled ? settled.reached : -1;
  const optional = new Set(d.optional || []);
  const stopIdx = v.state === 'stopped' && v.stopped_after ? route.indexOf(v.stopped_after) : -1;
  if (selHop === null) selHop = stopIdx >= 0 ? stopIdx : last;
  const stat = Object.fromEntries((d.hops || []).map(h => [h.hop, h]));
  const bad = v.state === 'stopped' || v.state === 'silent';
  // The server's sentence uses the server's clock; say it again in local time.
  const lostToo = v.missing - (v.rejected || 0);
  const waiting = v.state === 'unsure' ? (d.tap || []).find(b => b.hop === v.waiting_on) : null;
  const sentence = waiting ? `${tapText(waiting)}; no verdict until it catches up.`
    : v.state === 'stopped' && v.not_reached && v.rejected
    ? `${v.stopped_at ? `The ${v.stopped_at}` : `A service before ${hopShort(v.not_reached)}`} rejected ${v.rejected} readings since ${time(v.since)}: ${v.reason}.${lostToo > 0 ? ` ${lostToo} more never arrived at ${hopShort(v.not_reached)}.` : ''}`
    : v.state === 'stopped' && v.not_reached
    ? v.stopped_at ? `Readings stop at the ${v.stopped_at}. ${v.missing} readings since ${time(v.since)} reached ${hopShort(v.stopped_after)} and never arrived at ${hopShort(v.not_reached)}.`
    : `Readings stop after ${hopShort(v.stopped_after)}. ${v.missing} readings since ${time(v.since)} did not reach ${hopShort(v.not_reached)}.`
    : v.state === 'silent' && v.since ? `No readings at any hop since ${time(v.since)}.`
    : v.state === 'ok' && v.median_ns ? `Readings reach every hop, ${ms(v.median_ns)} from first to last.`
    : v.sentence;
  const shapeBy = Object.fromEntries((d.shapes || []).map(x => [x.hop, x]));
  const listFields = fs => fs.map(f => f.path).join(', ');
  const changeText = c => [c.removed && c.removed.length ? `${listFields(c.removed)} removed` : '', c.added && c.added.length ? `${listFields(c.added)} added` : '', c.retyped && c.retyped.length ? `${listFields(c.retyped)} changed type` : ''].filter(Boolean).join(', ');
  // A shape change at or before the stop, within 30 s of it, is the likely cause.
  const cause = v.state === 'stopped' && v.since ? route.slice(0, stopIdx + 1).map(h => shapeBy[h]).filter(x => x && x.change && Math.abs(new Date(x.current.first) - new Date(v.since)) <= 30000)[0] : null;
  const broken = (d.hops || []).filter(x => x.invalid > 0).sort((a, b) => route.indexOf(a.hop) - route.indexOf(b.hop))[0];
  const schemaText = broken ? ` ${broken.invalid} readings broke the declared schema at ${hopShort(broken.hop)}: ${broken.invalid_reason}.` : '';
  const fullSentence = (cause ? `${sentence} At the same moment its payload changed at ${hopShort(cause.hop)}: ${changeText(cause.change)}.` : sentence) + schemaText;

  const hopsHtml = route.map((h, i) => {
    const isStop = i === stopIdx, done = reached >= i || (optional.has(h) && !!stat[h] && reached >= i - 1);
    const fill = isStop ? 'var(--warn-dot)' : done ? 'var(--dot)' : 'transparent';
    const ring = isStop ? 'var(--warn-dot)' : done ? 'var(--dot)' : 'var(--off)';
    const meta = isStop ? 'last hop reached' : stat[h] ? `${stat[h].count} · ${ago(stat[h].last_seen)}` : optional.has(h) ? 'on demand, not yet' : 'not seen';
    return `<button type="button" class="hop ${i === selHop ? 'sel' : ''}" data-i="${i}">
      <span class="line"><span class="ring" style="background:${fill};box-shadow:inset 0 0 0 1.5px ${ring}${isStop ? ',0 0 0 3px var(--warn-bg)' : ''}"></span>${i < last ? (() => { const bar = `<span class="bar" style="background:${reached > i && !(isStop) ? 'var(--dot)' : 'var(--off)'}"></span>`; const via = (d.via || {})[route[i + 1]]; return via ? `${bar}<span class="via ${isStop ? 'bad' : ''}" title="service between ${esc(hopShort(h))} and ${esc(hopShort(route[i + 1]))}">${esc(via)}</span>${bar}` : bar; })() : ''}</span>
      <div class="k" style="color:${i > reached && !isStop && reached >= 0 ? 'var(--quiet)' : 'var(--ink)'}">${esc(hopShort(h))}</div>
      <div class="m mono" title="${esc(h)}">${esc(hopKind(h))} · ${esc(meta)}</div>
      ${shapeBy[h] ? `<div class="m mono" title="shape ${esc(shapeBy[h].current.fingerprint)}">shape ${esc(shapeBy[h].current.fingerprint.slice(0, 6))} · ${(shapeBy[h].current.fields || []).length} fields</div>` : ''}
      ${stat[h] && stat[h].invalid ? `<div class="m" style="color:var(--warn)">${stat[h].invalid} break the schema</div>` : ''}
      ${shapeBy[h] && shapeBy[h].change ? `<div class="m" style="color:var(--warn)">shape changed ${time(shapeBy[h].current.first)}</div>` : ''}</button>`;
  }).join('');

  const cols = `64px 84px repeat(${route.length}, minmax(48px, 1fr))`;
  const rows = d.journeys.slice(0, 14).map(j => {
    const at = new Set(j.hops.map(h => h.hop));
    const young = Date.now() - new Date(j.first) < 15000;
    return `<div class="grow pick${j.journey_id === selJourney ? ' on' : ''}" style="grid-template-columns:${cols}" data-j="${esc(j.journey_id)}" title="journey ${esc(j.journey_id)}">
      <span class="mono" style="padding-left:14px">${j.seq}</span><span class="mono quiet">${time(j.first)}</span>
      ${route.map((h, i) => {
        const hit = at.has(h);
        const missing = !hit && !young && i === j.reached + 1 && !optional.has(h);
        if (hit && j.invalid && j.invalid[h]) return `<span class="cell" title="broke the declared schema: ${esc(j.invalid[h])}" style="background:var(--warn-dot);box-shadow:inset 0 0 0 1.5px var(--warn-dot)"></span>`;
        if (missing && j.rejected) return `<span class="cell rej" title="rejected: ${esc(j.rejected)}">×</span>`;
        return `<span class="cell" style="background:${hit ? 'var(--dot)' : 'transparent'};box-shadow:inset 0 0 0 1.5px ${hit ? 'var(--dot)' : missing ? 'var(--warn-dot)' : 'var(--off)'}"></span>`;
      }).join('')}</div>`;
  }).join('');

  const h = route[selHop], s = stat[h];
  const total = d.journeys.filter(j => Date.now() - new Date(j.first) >= 15000).length;
  const reachedHere = d.journeys.filter(j => Date.now() - new Date(j.first) >= 15000 && j.hops.some(x => x.hop === h)).length;

  $('view').innerHTML = `
    <div style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap">
      <div style="flex:1 1 400px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1 class="mono">${esc(d.device)}</h1>${stateChip(v.state, v.stopped_after, (fleet.devices.find(x => x.device === d.device) || {}).expected, v.stopped_at, v.rejected > 0)}</div>
        <p style="margin:6px 0 0;color:${bad ? 'var(--ink)' : 'var(--quiet)'}">${esc(fullSentence)}</p>
        ${(d.findings || []).map(f => `<p style="margin:6px 0 0"><span class="chip bad" style="margin-right:6px">Wrong values</span>${esc(findingText(d.device, f))}</p>`).join('')}
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" type="button" id="watchBtn" title="${d.watch ? 'Stop capturing payloads' : 'Capture full payloads at every hop for one hour; kept 24 hours'}">${d.watch ? 'Stop watching' : 'Watch for 1 hour'}</button>
        <button class="btn" type="button" id="copyLink">Copy link</button>
      </div>
    </div>
    ${d.watch ? `<p class="quiet" style="margin:-8px 0 0">Watching since ${time(d.watch.since)} until ${time(d.watch.until)}: full payloads at every hop, redacted in the tap and kept 24 hours. Pick a reading to see them.</p>` : ''}
    <section aria-label="Route">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--quiet);font-size:12px;font-weight:500;margin-bottom:8px">
        <span>Route · ${route.length} hops</span>
        <span>${v.last_complete ? `Last complete journey ${time(v.last_complete)}` : 'No complete journey in this window'}${v.median_ns ? ` · ${ms(v.median_ns)} first to last hop` : ''}</span>
      </div>
      <div class="route">${hopsHtml}</div>
    </section>
    <div class="split">
      <section class="panel grid" style="flex:999 1 520px;min-width:0" aria-label="Recent readings">
        <div style="display:flex;justify-content:space-between;padding:12px 14px;font-weight:500"><span>Recent readings</span><span class="quiet" style="font-weight:400">each row is one reading</span></div>
        <div class="grow head" style="grid-template-columns:${cols}"><span style="padding-left:14px">Seq</span><span>Sent</span>${route.map(h => `<span style="text-align:center">${esc(hopShort(h))}</span>`).join('')}</div>
        ${rows || '<div class="empty">No readings in this window.</div>'}
      </section>
      ${selJourney && journeyCache[selJourney] ? readingPanel(journeyCache[selJourney], route) : `<aside class="panel" style="flex:1 1 280px;padding:16px;display:flex;flex-direction:column;gap:14px" aria-label="Hop detail">
        <div><div class="quiet" style="font-size:11px;font-weight:500">Selected hop</div>
          <div style="font-weight:600;font-size:15px;margin-top:2px">${esc(hopShort(h))}</div>
          <div class="mono quiet" style="word-break:break-all">${esc(h)}</div></div>
        <dl>
          <dt>Readings seen</dt><dd>${s ? s.count : 0}</dd>
          ${s && s.counted ? `<dt>Counted, all traffic</dt><dd title="hop events are sampled; counters cover every message, in five-minute buckets">${s.counted}</dd>` : ''}
          <dt>Last seen</dt><dd>${s ? time(s.last_seen) : '—'}</dd>
          <dt>Readings that got here</dt><dd style="color:${total && reachedHere < total ? 'var(--warn)' : 'inherit'}">${total ? `${reachedHere} of ${total}` : '—'}</dd>
          ${selHop === stopIdx && v.missing ? `<dt>Missing after it</dt><dd style="color:var(--warn)">${v.missing} since ${time(v.since)}</dd>` : ''}
          ${s && s.invalid ? `<dt>Broke the declared schema</dt><dd style="color:var(--warn)">${s.invalid}</dd><dt>Latest reason</dt><dd class="mono" style="color:var(--warn)">${esc(s.invalid_reason)}</dd>` : ''}
          ${selHop === stopIdx && v.rejected ? `<dt>Rejected by the ${esc(v.stopped_at || 'next service')}</dt><dd style="color:var(--warn)">${v.rejected}</dd><dt>Reason</dt><dd class="mono" style="color:var(--warn)">${esc(v.reason)}</dd>` : ''}
        </dl>
        ${shapePanel(shapeBy[h])}
        ${selHop === stopIdx && v.not_reached ? `<div class="quiet" style="border-top:1px solid var(--line2);padding-top:12px">Readings reach <span class="mono">${esc(hopShort(h))}</span> and never arrive at <span class="mono">${esc(hopShort(v.not_reached))}</span>. ${v.stopped_at ? `The ${esc(v.stopped_at)} carries them between those two hops: look there first.` : 'Whatever sits between those two hops is where to look.'}</div>` : ''}
      </aside>`}
    </div>
    ${aggregatesPanel(d)}`;
  for (const b of document.querySelectorAll('.hop')) b.onclick = () => { selHop = Number(b.dataset.i); selJourney = null; renderDevice(device); };
  for (const r of document.querySelectorAll('.grow.pick')) r.onclick = () => { selJourney = selJourney === r.dataset.j ? null : r.dataset.j; renderDevice(device); };
  if ($('closeReading')) $('closeReading').onclick = () => { selJourney = null; renderDevice(device); };
  $('watchBtn').onclick = async () => {
    $('watchBtn').disabled = true;
    try { await fetch(`/api/devices/${encodeURIComponent(device)}/watch`, { method: d.watch ? 'DELETE' : 'POST' }); } catch {}
    renderDevice(device);
  };
  $('copyLink').onclick = async () => { try { await navigator.clipboard.writeText(location.href); $('copyLink').textContent = 'Copied'; } catch {} };
}

// A confirmed mapping the device's readings broke, in one sentence.
function findingText(device, f) {
  const e = f.example, who = f.via ? `The ${f.via}` : `The service before ${hopShort(f.to)}`;
  const src = e.expr.split(/\s/)[0];
  return `${who} turned ${src} ${e.in} into ${e.field} ${e.got} for ${device} (seq ${f.seq}, ${time(f.last)}); the confirmed mapping ${e.field} = ${e.expr} expects ${e.want}. ${f.broken} of ${f.checked} watched readings since ${time(f.first)}.`;
}

async function renderMappings() {
  current = null;
  $('navFleet').classList.remove('on');
  $('navAggregates').classList.remove('on');
  $('navMappings').classList.add('on');
  const m = await get('/api/mappings');
  const statusChip = r => r.status === 'confirmed' && r.partial ? `<span class="chip bad"><span class="dot bad"></span>Confirmed, broken by ${esc((r.outliers || []).join(', '))}</span>`
    : r.status === 'confirmed' ? '<span class="chip"><span class="dot"></span>Confirmed</span>'
    : r.status === 'differs' ? `<span class="chip bad" title="confirmed: ${esc(r.confirmed)}"><span class="dot bad"></span>Differs from ${esc(r.confirmed)}</span>`
    : '<span class="chip shape">Not confirmed</span>';
  $('view').innerHTML = `
    <div><h1>Mappings</h1><p class="quiet" style="margin:6px 0 0">How each service maps fields from one hop to the next, worked out from the same readings seen on both sides. Only watched devices give paired readings; a proposal needs ${m.min_pairs} of them, 95% agreeing. Confirm one by adding it to the route step in the rules file, where it is reviewed like code; Hopwake then checks every watched reading against it.</p></div>
    ${m.edges.map((e, i) => `<section class="panel" style="padding:16px;display:flex;flex-direction:column;gap:12px" aria-label="Edge ${i + 1}">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <span style="font-weight:600"><span class="mono">${esc(hopShort(e.from))}</span> → <span class="mono">${esc(hopShort(e.to))}</span>${e.via ? ` <span class="quiet" style="font-weight:400">via ${esc(e.via)}</span>` : ''}</span>
        <span class="quiet">${e.pairs} paired readings from ${e.devices} watched ${e.devices === 1 ? 'device' : 'devices'}, last 24 hours</span>
      </div>
      ${e.relations.length ? `<table><thead><tr><th>Output field</th><th>Follows from</th><th>Kind</th><th>Fit</th><th>Status</th></tr></thead><tbody>
        ${e.relations.map(r => `<tr style="cursor:default"><td class="mono">${esc(r.out)}</td><td class="mono">${esc(r.expr)}</td><td class="quiet">${esc(r.kind)}</td><td class="quiet" style="${r.partial ? 'color:var(--warn)' : ''}">${Math.round(r.agree * 100)}%${r.partial && r.outliers ? `, not ${esc(r.outliers.join(', '))}` : ''}</td><td>${statusChip(r)}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty">${/^(hook|span):/.test(e.to) ? `No payloads at ${esc(hopShort(e.to))}: ${esc(e.via || 'the service')} marks readings there without them, so there is nothing to map.` : e.pairs < m.min_pairs ? `${e.pairs} of ${m.min_pairs} paired readings so far. Watch a device to collect more.` : 'No field follows from the input consistently.'}</div>`}
      ${e.new.length ? `<div class="quiet">New at ${esc(hopShort(e.to))}: <span class="mono">${e.new.map(esc).join(', ')}</span></div>` : ''}
      ${e.dropped.length ? `<div class="quiet">Not carried on from ${esc(hopShort(e.from))}: <span class="mono">${e.dropped.map(esc).join(', ')}</span></div>` : ''}
      ${e.unseen ? `<div class="quiet">Confirmed but not seen in the readings: <span class="mono">${Object.entries(e.unseen).map(([f, x]) => esc(`${f} = ${x}`)).join(', ')}</span></div>` : ''}
      ${e.relations.length ? `<div><div class="quiet" style="font-size:12px;margin-bottom:4px">As it would go on the route step for ${esc(hopShort(e.to))}</div><pre class="payload">${esc(e.yaml)}</pre></div>` : ''}
    </section>`).join('')}`;
}

const windowName = w => `${w.key} ${w.op}, ${time(w.start)}`;
let selWindow = null;

async function renderAggregates() {
  current = null;
  for (const id of ['navFleet', 'navMappings']) $(id).classList.remove('on');
  $('navAggregates').classList.add('on');
  const m = location.hash.match(/^#\/aggregates\/([^/]+)\/(\d+)$/);
  selWindow = m ? { key: decodeURIComponent(m[1]), start: m[2] } : null;
  const list = (await get(`/api/windows?window=${win()}`)).windows;
  const detail = selWindow ? await get(`/api/windows/${encodeURIComponent(selWindow.key)}/${selWindow.start}`).catch(() => null) : null;
  const val = w => { try { const o = JSON.parse(w.output); return o.median_temperature_k !== undefined ? `${o.median_temperature_k} K · ${o.median_pressure_pa} Pa` : ''; } catch { return ''; } };
  $('view').innerHTML = `
    <div><h1>Aggregates</h1><p class="quiet" style="margin:6px 0 0">Each output stands for many readings. The job that made it says which devices went in; a device that fed the key's earlier windows but not this one is missing.</p></div>
    <div class="split">
      <section class="panel" style="flex:999 1 520px;min-width:0;overflow-x:auto" aria-label="Outputs">
        ${list.length ? `<table><thead><tr><th>Output</th><th>Value</th><th>Readings</th><th>Devices</th><th>Missing</th></tr></thead><tbody>
        ${list.map(w => { const id = `${encodeURIComponent(w.key)}/${new Date(w.start).getTime()}`; return `<tr data-w="${id}" style="${selWindow && `${encodeURIComponent(selWindow.key)}/${selWindow.start}` === id ? 'background:var(--line2)' : ''}"><td>${esc(windowName(w))}</td><td class="mono quiet">${esc(val(w))}</td><td>${w.inputs}</td><td>${w.device_count}</td><td>${w.missing.length ? `<span class="chip bad">${w.missing.length === 1 ? esc(w.missing[0]) : `${w.missing.length} devices`}</span>` : '<span class="quiet">—</span>'}</td></tr>`; }).join('')}
        </tbody></table>` : '<div class="empty">No aggregated outputs in this window yet. Windows close a minute after they start.</div>'}
      </section>
      ${detail ? windowPanel(detail) : ''}
    </div>`;
  for (const tr of document.querySelectorAll('tr[data-w]')) tr.onclick = () => location.hash = `#/aggregates/${tr.dataset.w}`;
}

function windowPanel(d) {
  const w = d.window;
  return `<aside class="panel" style="flex:1 1 280px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0" aria-label="Output">
    <div><div class="quiet" style="font-size:11px;font-weight:500">Selected output</div>
      <div style="font-weight:600;font-size:15px;margin-top:2px">${esc(windowName(w))}</div>
      <div class="mono quiet">${esc(hopShort(w.hop))} · window ${time(w.start)}–${time(w.end)}</div></div>
    <p style="margin:0">${w.inputs} readings from ${w.device_count} devices${w.missing.length ? `; missing: <span class="mono">${w.missing.map(esc).join(', ')}</span>` : ''}.</p>
    <dl><dt>Hopwake saw at ${esc(hopShort(w.input_hop))}</dt><dd style="color:${d.seen < w.inputs ? 'var(--warn)' : 'inherit'}">${d.seen} of ${w.inputs}</dd></dl>
    ${d.missing.length ? `<div style="border-top:1px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:6px"><span style="font-weight:500">Missing devices</span>
      ${d.missing.map(a => `<a class="mono" href="#/device/${encodeURIComponent(a.device)}" style="color:var(--warn)">${esc(a.device)}</a><span class="quiet" style="margin-top:-4px">${a.furthest ? `got as far as ${esc(hopShort(a.furthest))} in this window` : 'not seen at any hop in this window'}</span>`).join('')}</div>` : ''}
    <div style="border-top:1px solid var(--line2);padding-top:10px"><span style="font-weight:500">Inputs by device</span>
      <div class="fields" style="margin-top:6px">${d.inputs.map(x => `<span class="same">${esc(x.device)} · ${x.readings}</span>`).join('') || '<span class="quiet">listed only up to 256 devices</span>'}</div></div>
  </aside>`;
}

// One reading at every hop it reached, with its payload where it was captured.
function readingPanel(j, route) {
  const hops = j.hops || [];
  const first = hops[0];
  const order = h => { const i = route.indexOf(h); return i < 0 ? 98 : i; };
  const sorted = [...hops].sort((a, b) => order(a.hop) - order(b.hop) || new Date(a.at) - new Date(b.at));
  const pretty = p => { try { return JSON.stringify(JSON.parse(p), null, 1); } catch { return p; } };
  return `<aside class="panel" style="flex:1 1 280px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0" aria-label="Reading">
    <div style="display:flex;justify-content:space-between;gap:8px"><div><div class="quiet" style="font-size:11px;font-weight:500">Selected reading</div>
      <div style="font-weight:600;font-size:15px;margin-top:2px">seq ${first ? first.seq : '—'}</div>
      <div class="mono quiet" style="word-break:break-all">${esc(j.journey_id)}</div></div>
      <button class="linkish" type="button" id="closeReading">Back to hop</button></div>
    ${sorted.map(x => `<div style="border-top:1px solid var(--line2);padding-top:10px">
      <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:500">${esc(hopShort(x.hop))}</span><span class="mono quiet">${time(x.at)}${first ? ` · +${Math.max(0, new Date(x.at) - new Date(first.at))} ms` : ''}</span></div>
      ${x.op !== 'receive' ? `<div class="mono" style="color:var(--warn)">${esc(x.op === 'drop' ? 'rejected' : x.op === 'error' ? 'broke the schema' : x.op)}${x.reason ? `: ${esc(x.reason)}` : ''}</div>` : ''}
      ${x.payload ? `<pre class="payload">${esc(pretty(x.payload))}</pre>` : `<div class="quiet" style="font-size:12px">${x.bytes} bytes; payload not captured</div>`}
    </div>`).join('')}
  </aside>`;
}

function aggregatesPanel(d) {
  const a = d.aggregates || { fed: [], missing: [] };
  if (!a.fed.length && !a.missing.length) return '';
  const link = w => `#/aggregates/${encodeURIComponent(w.key)}/${new Date(w.start).getTime()}`;
  return `<section class="panel" style="padding:14px;display:flex;flex-direction:column;gap:8px" aria-label="Aggregates">
    <div style="font-weight:500">Aggregates</div>
    ${a.missing.length ? `<p style="margin:0;color:var(--warn)">Missing from ${a.missing.length} ${esc(a.missing[0].key)} ${esc(a.missing[0].op)} ${a.missing.length === 1 ? 'output' : 'outputs'} since ${time(a.missing[a.missing.length - 1].start)}: ${a.missing.slice(0, 4).map(w => `<a href="${link(w)}">${time(w.start)}</a>`).join(', ')}${a.missing.length > 4 ? ', …' : ''}.</p>` : ''}
    ${a.fed.length ? `<p class="quiet" style="margin:0">Fed ${a.fed.slice(0, 5).map(w => `<a href="${link(w)}">${esc(windowName(w))}</a> (${w.inputs} readings, ${w.device_count} devices)`).join(', ')}.</p>` : ''}
  </section>`;
}

function shapePanel(x) {
  if (!x) return '';
  const cur = x.current.fields || [];
  const c = x.change;
  const removed = c && c.removed ? c.removed.map(f => `${f.path}:${f.type}`) : [];
  const changed = new Set([...(c && c.added ? c.added : []), ...(c && c.retyped ? c.retyped : [])].map(f => `${f.path}:${f.type}`));
  const lines = [
    ...removed.map(f => `<span class="rem">− ${esc(f)}</span>`),
    ...cur.map(f => changed.has(f) ? `<span class="add">+ ${esc(f)}</span>` : `<span class="same">&nbsp; ${esc(f)}</span>`),
  ];
  return `<div style="border-top:1px solid var(--line2);padding-top:12px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:500">Payload shape</span><span class="mono quiet">${esc(x.current.fingerprint.slice(0, 6))}</span></div>
    ${c ? `<div class="quiet">Changed at ${time(x.current.first)}; before that, shape <span class="mono">${esc(x.previous.fingerprint.slice(0, 6))}</span> until ${time(x.previous.last)}.</div>` : `<div class="quiet">One shape in this window, ${x.current.count} readings.</div>`}
    <div class="fields">${lines.join('')}</div></div>`;
}

async function route() {
  clearTimeout(timer);
  const m = location.hash.match(/^#\/device\/(.+)$/);
  try {
    await loadFleet();
    if (m) await renderDevice(decodeURIComponent(m[1]));
    else if (location.hash === '#/mappings') await renderMappings();
    else if (location.hash.startsWith('#/aggregates')) await renderAggregates();
    else { current = null; renderFleet(); }
  } catch (e) { $('view').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  timer = setTimeout(route, 5000);
}

$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && $('q').value.trim()) { location.hash = `#/device/${encodeURIComponent($('q').value.trim())}`; $('q').value = ''; $('q').blur(); } });
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); $('q').focus(); } });
$('window').onchange = route;
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
