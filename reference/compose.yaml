# Reference IoT pipeline used to develop and test Hopwake.
# Start: docker compose -f reference/compose.yaml up -d
name: hopwake-reference

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Creates the topics before any service needs them, so a cold start does not
  # depend on the order in which producers and consumers come up.
  kafka-topics:
    image: apache/kafka:4.0.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in telemetry.raw telemetry.normalized telemetry.site_minute telemetry.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$t" --partitions 6 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  bridge:
    build:
      context: ..
      dockerfile: reference/go.Dockerfile
      args:
        CMD: bridge
    environment:
      BRIDGE_MQTT: tcp://mosquitto:1883
      BRIDGE_KAFKA: kafka:29092
      OTEL_SERVICE_NAME: bridge
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_SAMPLE:-1}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      FAULT_DEVICES: ${BRIDGE_FAULT_DEVICES:-}
      FAULT_DROP: ${BRIDGE_FAULT_DROP:-0}
      FAULT_DUPLICATE: ${BRIDGE_FAULT_DUPLICATE:-0}
      FAULT_DELAY: ${BRIDGE_FAULT_DELAY:-0s}
      FAULT_DELAY_RATE: ${BRIDGE_FAULT_DELAY_RATE:-0}
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
      kafka:
        condition: service_healthy

  normaliser:
    build: ./normaliser
    environment:
      NORMALISER_KAFKA: kafka:29092
      OTEL_SERVICE_NAME: normaliser
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_SAMPLE:-1}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      FAULT_DEVICES: ${NORMALISER_FAULT_DEVICES:-}
      FAULT_DROP: ${NORMALISER_FAULT_DROP:-0}
      FAULT_RENAME: ${NORMALISER_FAULT_RENAME:-0}
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  aggregator:
    build: ./aggregator
    restart: on-failure
    environment:
      AGGREGATOR_KAFKA: kafka:29092
      OTEL_SERVICE_NAME: aggregator
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_SAMPLE:-1}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hopwake
      POSTGRES_PASSWORD: hopwake
      POSTGRES_DB: reference
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hopwake -d reference"]
      interval: 5s
      timeout: 5s
      retries: 10

  recorder:
    build:
      context: ..
      dockerfile: reference/go.Dockerfile
      args:
        CMD: recorder
    environment:
      RECORDER_KAFKA: kafka:29092
      RECORDER_DB: postgres://hopwake:hopwake@postgres:5432/reference
      OTEL_SERVICE_NAME: recorder
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_SAMPLE:-1}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    build: ./api
    environment:
      API_DB: postgres://hopwake:hopwake@postgres:5432/reference
      OTEL_SERVICE_NAME: api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_SAMPLE:-1}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  devicesim:
    build:
      context: ..
      dockerfile: reference/go.Dockerfile
      args:
        CMD: devicesim
    command: ["-broker", "tcp://mosquitto:1883", "-devices", "${DEVICES:-50}", "-interval", "${INTERVAL:-5s}"]
    depends_on:
      mosquitto:
        condition: service_healthy

  # Trace store and UI for the OpenTelemetry baseline: http://localhost:16686
  # Only with the tracing profile, see reference/tracing.env.
  jaeger:
    image: jaegertracing/jaeger:2.5.0
    profiles: ["tracing"]
    ports:
      - "16686:16686"
      - "4318:4318"
