# Where Hopwake finds the device and sequence number of each reading in the
# reference pipeline. Each hop derives the same journey ID from them.
tenant: reference
sources:
  - name: raw readings from devices
    kind: mqtt
    match: plant/+/+/telemetry
    device_from_topic: plant/+/{device}/telemetry
    seq_field: seq
  - name: readings as the bridge forwards them
    kind: kafka
    match: telemetry.raw
    device_field: device_id
    seq_field: seq
  - name: normalised readings
    kind: kafka
    match: telemetry.normalized
    device_field: device
    seq_field: seq
  # Readings the normaliser could not handle. They never reach normalized;
  # the tap records them as rejected, with the normaliser's reason.
  - name: readings the normaliser rejected
    kind: kafka
    match: telemetry.dlq
    device_field: device_id
    seq_field: seq
    role: dead-letter
    rejects: kafka:telemetry.normalized
    reason_header: dlq_reason
# The hops a reading should pass, in order. The journey service compares what
# it sees with this to say where a device's data stopped. via names the
# service that carries readings to a hop from the one before, so a stop
# between two hops is reported as a stop at that service.
route:
  - hop: mqtt:plant/+/+/telemetry
  - hop: kafka:telemetry.raw
    via: bridge
  - hop: kafka:telemetry.normalized
    via: normaliser
