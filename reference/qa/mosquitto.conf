# Two listeners, as a production broker often has: one inside, where the
# devices and the bridge connect, and one outside with TLS and passwords,
# where the tap connects with a user that may only read.
per_listener_settings true

listener 1883
allow_anonymous true

listener 8883
cafile /certs/ca.pem
certfile /certs/broker.pem
keyfile /certs/broker.key
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

max_queued_messages 100000
