<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plant portal</title>
<style>
  :root { --bg:#f4f6f8; --panel:#fff; --ink:#17202a; --quiet:#5d6b78; --line:#dde3e8; --accent:#0f6fbf; --ok:#1f8a4c; --stale:#b45309; --bad:#b42318; --mono: ui-monospace, Menlo, monospace; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f141a; --panel:#17202a; --ink:#e6edf3; --quiet:#93a1ae; --line:#2a3642; --accent:#58a6ff; --ok:#3fb950; --stale:#d29922; --bad:#f85149; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding:16px 24px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  h1 { margin:0; font-size:18px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--quiet); margin:0 0 10px; }
  main { padding:20px 24px; display:grid; gap:20px; max-width:1200px; }
  .sites { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .site { cursor:pointer; }
  .site.sel { outline:2px solid var(--accent); }
  .big { font-size:28px; font-weight:650; font-variant-numeric:tabular-nums; }
  .meta { color:var(--quiet); font-size:12px; }
  svg { display:block; width:100%; height:40px; margin-top:8px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--quiet); font-weight:600; }
  td.mono { font-family:var(--mono); }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .ok { background:var(--ok); } .stale { background:var(--stale); } .gone { background:var(--bad); }
  form { display:flex; gap:8px; margin-bottom:12px; }
  input { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); min-width:220px; }
  button { font:inherit; font-weight:600; padding:7px 14px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width: 900px) { .two { grid-template-columns:1fr; } }
  .scroll { max-height:420px; overflow:auto; }
  .empty { color:var(--quiet); }
</style>
</head>
<body>
<header>
  <h1>Plant portal</h1>
  <span class="meta" id="updated">Loading…</span>
</header>
<main>
  <section>
    <h2>Sites · median temperature, last closed minute</h2>
    <div class="sites" id="sites"></div>
  </section>
  <div class="two">
    <section class="card">
      <h2 id="devicesTitle">Devices</h2>
      <div class="scroll"><table><thead><tr><th>Device</th><th>Last seen</th><th>Last seq</th></tr></thead><tbody id="devices"></tbody></table></div>
    </section>
    <section class="card">
      <h2>Device readings</h2>
      <form id="lookup"><input id="deviceId" placeholder="Device ID, e.g. dev-00042" autocomplete="off"><button>Show</button></form>
      <div id="readings" class="scroll"><p class="empty">Pick a device from the list or enter its ID.</p></div>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const get = async p => { const r = await fetch(p); if (!r.ok) throw new Error(`${p}: ${r.status}`); return r.json(); };
const ago = iso => { const s = Math.round((Date.now() - new Date(iso)) / 1000); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`; };
const freshness = iso => { const s = (Date.now() - new Date(iso)) / 1000; return s < 30 ? 'ok' : s < 300 ? 'stale' : 'gone'; };
let site = null;

function spark(points) {
  if (points.length < 2) return '<svg></svg>';
  const ys = points.map(p => p.median_temperature_c), lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${(i / (points.length - 1) * 100).toFixed(2)} ${(36 - (p.median_temperature_c - lo) / span * 32).toFixed(2)}`).join('');
  return `<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-label="last hour"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" style="color:var(--accent)"/></svg>`;
}

async function loadSites() {
  const sites = await get('/api/sites');
  if (!site && sites.length) site = sites[0].site;
  const minutes = await Promise.all(sites.map(s => get(`/api/sites/${s.site}/minutes?limit=60`)));
  $('sites').innerHTML = sites.length ? sites.map((s, i) => `
    <div class="card site ${s.site === site ? 'sel' : ''}" data-site="${esc(s.site)}">
      <div class="meta">${esc(s.site)}</div>
      <div class="big">${s.median_temperature_c.toFixed(1)} °C</div>
      <div class="meta">${s.readings.toLocaleString()} readings from ${s.devices} devices · ${(s.median_pressure_pa / 1000).toFixed(1)} kPa</div>
      <div class="meta">minute ending ${new Date(s.window_end).toLocaleTimeString()}</div>
      ${spark(minutes[i])}
    </div>`).join('') : '<p class="empty">No site data yet.</p>';
  for (const el of document.querySelectorAll('.site')) el.onclick = () => { site = el.dataset.site; refresh(); };
}

async function loadDevices() {
  if (!site) return;
  const devices = await get(`/api/sites/${site}/devices`);
  $('devicesTitle').textContent = `Devices · ${site} · ${devices.length}`;
  $('devices').innerHTML = devices.map(d => `
    <tr><td class="mono"><a href="#" data-device="${esc(d.device)}">${esc(d.device)}</a></td>
    <td><span class="dot ${freshness(d.last_seen)}"></span>${ago(d.last_seen)}</td><td class="mono">${d.last_seq}</td></tr>`).join('');
  for (const a of document.querySelectorAll('[data-device]')) a.onclick = e => { e.preventDefault(); $('deviceId').value = a.dataset.device; loadReadings(); };
}

async function loadReadings() {
  const id = $('deviceId').value.trim();
  if (!id) return;
  const rows = await get(`/api/devices/${encodeURIComponent(id)}/readings?limit=50`);
  $('readings').innerHTML = rows.length ? `
    <p class="meta"><span class="dot ${freshness(rows[0].observed_at)}"></span>Last reading ${ago(rows[0].observed_at)} at ${esc(rows[0].site)}</p>
    <table><thead><tr><th>Seq</th><th>Observed</th><th>°C</th><th>kPa</th><th>mm/s</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="mono">${r.seq}</td><td>${new Date(r.observed_at).toLocaleTimeString()}</td><td>${r.temperature_c.toFixed(2)}</td><td>${(r.pressure_pa / 1000).toFixed(2)}</td><td>${r.vibration_mm_s.toFixed(2)}</td></tr>`).join('')}
    </tbody></table>` : `<p class="empty">No readings stored for ${esc(id)}.</p>`;
}

async function refresh() {
  try {
    await loadSites();
    await loadDevices();
    if ($('deviceId').value.trim()) await loadReadings();
    $('updated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
  } catch (e) { $('updated').textContent = e.message; }
}
$('lookup').onsubmit = e => { e.preventDefault(); loadReadings(); };
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
