name: go

on:
  push:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", "reference/journey-rules.yaml", ".github/workflows/go.yml"]
  pull_request:
    paths: ["**.go", "go.mod", "go.sum", "reference/journey-rules.yaml", ".github/workflows/go.yml"]

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l . | grep -v node_modules)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
